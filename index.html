<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Check-in EJC</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 10px; }

    /* Resultado: faixa fixa no topo, sempre visível */
    #resultado {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      display: none; padding: 24px 16px 20px; font-size: 28px; font-weight: bold;
      box-shadow: 0 6px 20px rgba(0,0,0,.4); border-bottom: 6px solid rgba(0,0,0,.25);
    }
    #resultado small { font-size: 18px; font-weight: normal; }
    .ok { background: #2e7d32; color: #fff; }
    .aviso { background: #f9a825; color: #222; }
    .erro { background: #c62828; color: #fff; }

    button {
      padding: 14px 28px; font-size: 18px; border-radius: 8px;
      border: none; background: #4285f4; color: white; margin-top: 8px;
    }
    button:disabled { opacity: 0.5; }
    .verde { background: #34a853; }
    .claro { background: #fff; color: #222; border: 2px solid #222; }
    #resultado button { margin: 10px 4px 0; }

    section { margin-top: 30px; padding-top: 20px; border-top: 1px solid #ccc; }
    input { padding: 12px; font-size: 18px; border: 1px solid #999; border-radius: 8px; }
    #codigoInput { width: 70%; max-width: 260px; text-transform: uppercase; }
    #qtdVenda { width: 90px; text-align: center; }

    #estoque h3 { margin: 10px 0 4px; font-size: 14px; color: #555; text-transform: uppercase; }
    .linha { display: flex; gap: 8px; justify-content: center; margin-bottom: 6px; }
    .box { flex: 1; max-width: 140px; background: #f1f3f4; border-radius: 10px; padding: 8px 4px; }
    .box b { display: block; font-size: 28px; }
    .box span { font-size: 12px; color: #555; }
    .box small { display: block; font-size: 11px; color: #777; }
    .box.destaque { background: #d4edda; }
    .box.zero { background: #f8d7da; }
  </style>
</head>
<body>
  <h2>Check-in EJC</h2>

  <div id="estoque"></div>

  <button id="iniciarBtn">📷 Iniciar Leitura</button>
  <div id="reader" style="width:100%; margin-top:20px;"></div>

  <section>
    <p>Sem conseguir ler o QR Code? Digite o código:</p>
    <input id="codigoInput" type="text" placeholder="EJC-0001-K7" autocomplete="off" autocapitalize="characters">
    <br>
    <button id="validarBtn" class="verde">✔ Validar código</button>
  </section>

  <section>
    <p><b>Venda na hora</b> (sem reserva)</p>
    <input id="qtdVenda" type="number" min="1" max="50" value="1" inputmode="numeric">
    <br>
    <button id="vendaBtn" class="verde">🛒 Registrar venda</button>
  </section>

  <div id="resultado"></div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbx78rgHUib1pQFznNsi4W5TCdDgbyP3ZML5YgGJXddKd-Ru4zg0yXBoOTt6IccJ4D4fsA/exec";

    const resultadoDiv = document.getElementById("resultado");
    const iniciarBtn = document.getElementById("iniciarBtn");
    const codigoInput = document.getElementById("codigoInput");
    const validarBtn = document.getElementById("validarBtn");
    const qtdVenda = document.getElementById("qtdVenda");
    const vendaBtn = document.getElementById("vendaBtn");
    let processando = false;
    let vendendo = false;
    let bloqueioAte = 0;
    let ultimoCodigo = "";
    let senha = "";
    let scanner;

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
      ));
    }

    // Aceita "ejc0005k7", "EJC 0005 K7" ou "EJC-0005-K7". Códigos antigos (EJC-0005) também.
    function normalizarCodigo(texto) {
      const c = String(texto).trim().toUpperCase().replace(/[\s-]+/g, "");
      const m = c.match(/^EJC(\d{4})([A-Z0-9]{2})?$/);
      if (!m) return String(texto).trim().toUpperCase();
      return "EJC-" + m[1] + (m[2] ? "-" + m[2] : "");
    }

    // ----- Faixa de resultado (fica até tocar em OK) -----
    function liberar() {
      resultadoDiv.style.display = "none";
      processando = false;
      bloqueioAte = Date.now() + 2500; // evita reler o mesmo QR logo após fechar
    }

    function mostrar(classe, html, botoes) {
      resultadoDiv.className = classe;
      resultadoDiv.innerHTML = html + "<div>" +
        (botoes || "<button class='claro' onclick='liberar()'>OK</button>") + "</div>";
      resultadoDiv.style.display = "block";
      window.scrollTo(0, 0);
      if (navigator.vibrate) navigator.vibrate(classe === "ok" ? 150 : [200, 100, 200]);
    }

    function chamar(params) {
      const qs = new URLSearchParams(params).toString();
      return fetch(API_URL + "?" + qs).then(r => r.json());
    }

    function erroConexao() {
      mostrar("erro", "❌ ERRO DE CONEXÃO<br><small>Confira a internet e tente de novo.</small>");
    }

    function pedirSenha() {
      if (!senha) senha = prompt("Senha do responsável financeiro:") || "";
      return senha;
    }

    // ----- Painel de estoque -----
    function renderEstoque(e) {
      const classeSem = e.disponivel <= 0 ? " zero" : " destaque";
      document.getElementById("estoque").innerHTML =
        "<h3>Totais</h3>" +
        "<div class='linha'>" +
          "<div class='box'><b>" + e.total + "</b><span>Produzidos</span></div>" +
          "<div class='box'><b>" + e.reservado + "</b><span>Reservados</span><small>" + e.retirados + " já retirados</small></div>" +
          "<div class='box'><b>" + e.adicional + "</b><span>Sem reserva</span><small>" + e.vendidos + " já vendidos</small></div>" +
        "</div>" +
        "<h3>Ainda disponíveis</h3>" +
        "<div class='linha'>" +
          "<div class='box'><b>" + e.aguardando + "</b><span>Reservas a retirar</span></div>" +
          "<div class='box" + classeSem + "'><b>" + e.disponivel + "</b><span>Sem reserva disponível</span></div>" +
          "<div class='box'><b>" + e.restante + "</b><span>Total restante</span></div>" +
        "</div>";
    }

    function atualizarEstoque() {
      chamar({ acao: "estoque" })
        .then(r => {
          if (r.estoque) renderEstoque(r.estoque);
          else if (r.status === "sem_controle") {
            document.getElementById("estoque").innerHTML =
              "<p>⚠️ Abas de controle não encontradas. Rode <b>configurarControle</b> no Apps Script.</p>";
          }
        })
        .catch(() => {});
    }

    // ----- Câmera -----
    iniciarBtn.addEventListener("click", () => {
      iniciarBtn.style.display = "none";
      scanner = new Html5Qrcode("reader");
      scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        (codigo) => validar(codigo, true)
      ).catch(() => {
        mostrar("erro", "❌ Não foi possível acessar a câmera<br><small>Use a digitação do código.</small>");
      });
    });

    // ----- Validação por código -----
    validarBtn.addEventListener("click", () => {
      if (!codigoInput.value.trim()) return;
      validar(codigoInput.value, false);
    });

    codigoInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") validarBtn.click();
    });

    function validar(texto, daCamera) {
      if (processando) return;
      if (daCamera && Date.now() < bloqueioAte) return;
      processando = true;
      ultimoCodigo = normalizarCodigo(texto);
      chamar({ codigo: ultimoCodigo }).then(mostrarResultado).catch(erroConexao);
    }

    // ----- Pagamento na hora -----
    function confirmarPagamento() {
      if (!pedirSenha()) return;
      chamar({ acao: "pagar", codigo: ultimoCodigo, senha: senha })
        .then(res => {
          if (res.status === "senha_invalida") {
            senha = "";
            mostrar("erro", "❌ SENHA INCORRETA",
              "<button class='claro' onclick='confirmarPagamento()'>Tentar de novo</button>" +
              "<button class='claro' onclick='liberar()'>Cancelar</button>");
          } else {
            mostrarResultado(res);
          }
        })
        .catch(erroConexao);
    }

    function mostrarResultado(res) {
      codigoInput.value = "";
      if (res.status === "ok") {
        mostrar("ok", "✅ LIBERADO<br>" + esc(res.nome) + "<br>" + esc(res.qtd) + " hambúrguer(es)" +
          (res.pagoAgora ? "<br><small>Pagamento registrado agora</small>" : ""));
        atualizarEstoque();
      } else if (res.status === "ja_retirado") {
        mostrar("aviso", "⚠️ JÁ RETIRADO<br>" + esc(res.nome));
      } else if (res.status === "nao_pago") {
        mostrar("aviso",
          "⚠️ PAGAMENTO NÃO CONFIRMADO<br>" + esc(res.nome) + "<br>" + esc(res.qtd || "") + " hambúrguer(es)",
          "<button class='verde' onclick='confirmarPagamento()'>💵 Recebi o pagamento e liberar</button>" +
          "<button class='claro' onclick='liberar()'>Cancelar</button>");
      } else if (res.status === "nao_encontrado") {
        mostrar("erro", "❌ CÓDIGO NÃO ENCONTRADO");
      } else {
        mostrar("erro", "❌ Resposta inesperada do servidor");
      }
    }

    // ----- Venda sem reserva -----
    vendaBtn.addEventListener("click", () => {
      if (vendendo) return;
      const qtd = parseInt(qtdVenda.value, 10);
      if (!qtd || qtd < 1) return;
      if (!pedirSenha()) return;
      if (!confirm("Registrar venda de " + qtd + " hambúrguer(es)?")) return;

      vendendo = true;
      vendaBtn.disabled = true;
      chamar({ acao: "venda", qtd: qtd, senha: senha })
        .then(res => {
          if (res.status === "senha_invalida") {
            senha = "";
            mostrar("erro", "❌ SENHA INCORRETA");
          } else if (res.status === "sem_estoque") {
            renderEstoque(res.estoque);
            mostrar("erro", "❌ SEM ESTOQUE<br><small>Restam " + res.estoque.disponivel + " para venda sem reserva.</small>");
          } else if (res.status === "quantidade_invalida") {
            mostrar("erro", "❌ QUANTIDADE INVÁLIDA");
          } else if (res.status === "sem_controle") {
            mostrar("erro", "❌ Abas de controle não encontradas<br><small>Rode configurarControle no Apps Script.</small>");
          } else {
            renderEstoque(res.estoque);
            qtdVenda.value = 1;
            mostrar("ok", "✅ VENDA REGISTRADA<br>" + esc(res.qtd) + " hambúrguer(es)<br>" +
              "<small>Restam " + res.estoque.disponivel + " para venda sem reserva</small>");
          }
        })
        .catch(erroConexao)
        .finally(() => { vendendo = false; vendaBtn.disabled = false; });
    });

    atualizarEstoque();
    setInterval(atualizarEstoque, 30000);
  </script>
</body>
</html>
