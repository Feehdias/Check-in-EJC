<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Check-in EJC</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 10px; }
    #resultado { margin-top: 20px; padding: 20px; border-radius: 10px; font-size: 18px; display: none; }
    .ok { background: #d4edda; color: #155724; }
    .aviso { background: #fff3cd; color: #856404; }
    .erro { background: #f8d7da; color: #721c24; }
    button {
      padding: 14px 28px; font-size: 18px; border-radius: 8px;
      border: none; background: #4285f4; color: white; margin-top: 8px;
    }
    button:disabled { opacity: 0.5; }
    .verde { background: #34a853; }
    section { margin-top: 30px; padding-top: 20px; border-top: 1px solid #ccc; }
    input { padding: 12px; font-size: 18px; border: 1px solid #999; border-radius: 8px; }
    #codigoInput { width: 70%; max-width: 260px; text-transform: uppercase; }
    #qtdVenda { width: 90px; text-align: center; }
    #estoque { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 10px; }
    .box { background: #f1f3f4; border-radius: 10px; padding: 8px 12px; min-width: 130px; }
    .box b { display: block; font-size: 26px; }
    .box span { font-size: 12px; color: #555; }
    .box.destaque { background: #d4edda; }
    .box.zero { background: #f8d7da; }
  </style>
</head>
<body>
  <h2>Check-in EJC</h2>

  <div id="estoque"></div>

  <button id="iniciarBtn">📷 Iniciar Leitura</button>
  <div id="reader" style="width:100%; margin-top:20px;"></div>

  <section>
    <p>Sem conseguir ler o QR Code? Digite o código:</p>
    <input id="codigoInput" type="text" placeholder="EJC-0001-K7" autocomplete="off" autocapitalize="characters">
    <br>
    <button id="validarBtn" class="verde">✔ Validar código</button>
  </section>

  <section>
    <p><b>Venda na hora</b> (sem reserva)</p>
    <input id="qtdVenda" type="number" min="1" max="50" value="1" inputmode="numeric">
    <br>
    <button id="vendaBtn" class="verde">🛒 Registrar venda</button>
  </section>

  <div id="resultado"></div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbx78rgHUib1pQFznNsi4W5TCdDgbyP3ZML5YgGJXddKd-Ru4zg0yXBoOTt6IccJ4D4fsA/exec";

    const resultadoDiv = document.getElementById("resultado");
    const iniciarBtn = document.getElementById("iniciarBtn");
    const codigoInput = document.getElementById("codigoInput");
    const validarBtn = document.getElementById("validarBtn");
    const qtdVenda = document.getElementById("qtdVenda");
    const vendaBtn = document.getElementById("vendaBtn");
    let processando = false;
    let vendendo = false;
    let senha = "";
    let scanner;

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
      ));
    }

    // Aceita "ejc0005k7", "EJC 0005 K7" ou "EJC-0005-K7". Códigos antigos (EJC-0005) também.
    function normalizarCodigo(texto) {
      const c = String(texto).trim().toUpperCase().replace(/[\s-]+/g, "");
      const m = c.match(/^EJC(\d{4})([A-Z0-9]{2})?$/);
      if (!m) return String(texto).trim().toUpperCase();
      return "EJC-" + m[1] + (m[2] ? "-" + m[2] : "");
    }

    function liberar() {
      resultadoDiv.style.display = "none";
      processando = false;
    }

    function mostrar(classe, html, auto) {
      resultadoDiv.style.display = "block";
      resultadoDiv.className = classe;
      resultadoDiv.innerHTML = html;
      if (auto) setTimeout(liberar, 3000);
    }

    function chamar(params) {
      const qs = new URLSearchParams(params).toString();
      return fetch(API_URL + "?" + qs).then(r => r.json());
    }

    function erroConexao() {
      mostrar("erro", "❌ Erro de conexão. Tente novamente.", true);
    }

    // ----- Estoque -----
    function renderEstoque(e) {
      const classe = e.disponivel <= 0 ? " zero" : " destaque";
      document.getElementById("estoque").innerHTML =
        "<div class='box" + classe + "'><b>" + e.disponivel + "</b><span>Disponível p/ venda na hora</span></div>" +
        "<div class='box'><b>" + e.aguardando + "</b><span>Reservas aguardando retirada</span></div>" +
        "<div class='box'><b>" + e.restante + "</b><span>Estoque restante total</span></div>" +
        "<div class='box'><b>" + e.vendidos + "</b><span>Vendidos na hora</span></div>";
    }

    function atualizarEstoque() {
      chamar({ acao: "estoque" })
        .then(r => { if (r.estoque) renderEstoque(r.estoque); })
        .catch(() => {});
    }

    // ----- Câmera -----
    iniciarBtn.addEventListener("click", () => {
      iniciarBtn.style.display = "none";
      scanner = new Html5Qrcode("reader");
      scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        (codigo) => validar(codigo)
      ).catch(() => {
        mostrar("erro", "❌ Não foi possível acessar a câmera. Use a digitação do código abaixo.", false);
      });
    });

    // ----- Validação por código -----
    validarBtn.addEventListener("click", () => {
      if (!codigoInput.value.trim()) return;
      validar(codigoInput.value);
    });

    codigoInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") validarBtn.click();
    });

    function validar(texto) {
      if (processando) return;
      processando = true;
      chamar({ codigo: normalizarCodigo(texto) }).then(mostrarResultado).catch(erroConexao);
    }

    function mostrarResultado(res) {
      codigoInput.value = "";
      if (res.status === "ok") {
        mostrar("ok", "✅ LIBERADO<br>" + esc(res.nome) + " - " + esc(res.qtd) + " hambúrguer(es)", true);
        atualizarEstoque();
      } else if (res.status === "ja_retirado") {
        mostrar("aviso", "⚠️ JÁ RETIRADO<br>" + esc(res.nome), true);
      } else if (res.status === "nao_pago") {
        mostrar("aviso", "⚠️ PAGAMENTO NÃO CONFIRMADO<br>" + esc(res.nome), true);
      } else {
        mostrar("erro", "❌ CÓDIGO NÃO ENCONTRADO", true);
      }
    }

    // ----- Venda na hora -----
    vendaBtn.addEventListener("click", () => {
      if (vendendo) return;
      const qtd = parseInt(qtdVenda.value, 10);
      if (!qtd || qtd < 1) return;
      if (!senha) senha = prompt("Senha do responsável financeiro:") || "";
      if (!senha) return;
      if (!confirm("Registrar venda de " + qtd + " hambúrguer(es)?")) return;

      vendendo = true;
      vendaBtn.disabled = true;
      chamar({ acao: "venda", qtd: qtd, senha: senha })
        .then(res => {
          if (res.status === "senha_invalida") {
            senha = "";
            mostrar("erro", "❌ Senha incorreta.", true);
          } else if (res.status === "sem_estoque") {
            renderEstoque(res.estoque);
            mostrar("erro", "❌ Sem estoque suficiente. Restam " + res.estoque.disponivel + " para venda na hora.", true);
          } else if (res.status === "quantidade_invalida") {
            mostrar("erro", "❌ Quantidade inválida.", true);
          } else if (res.status === "sem_controle") {
            mostrar("erro", "❌ Abas de controle não encontradas. Rode configurarControle no Apps Script.", false);
          } else {
            renderEstoque(res.estoque);
            qtdVenda.value = 1;
            mostrar("ok", "✅ VENDA REGISTRADA<br>" + esc(res.qtd) + " hambúrguer(es)<br>" +
              "<small>Restam " + res.estoque.disponivel + " para venda na hora</small>", true);
          }
        })
        .catch(erroConexao)
        .finally(() => { vendendo = false; vendaBtn.disabled = false; });
    });

    atualizarEstoque();
  </script>
</body>
</html>
