<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Check-in EJC</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 10px; }
    #resultado { margin-top: 20px; padding: 20px; border-radius: 10px; font-size: 18px; display: none; }
    .ok { background: #d4edda; color: #155724; }
    .aviso { background: #fff3cd; color: #856404; }
    .erro { background: #f8d7da; color: #721c24; }
    button {
      padding: 14px 28px; font-size: 18px; border-radius: 8px;
      border: none; background: #4285f4; color: white;
    }
    #manual { margin-top: 30px; padding-top: 20px; border-top: 1px solid #ccc; }
    #codigoInput {
      padding: 12px; font-size: 18px; width: 70%; max-width: 260px;
      border: 1px solid #999; border-radius: 8px; text-transform: uppercase;
    }
    #validarBtn { margin-top: 12px; background: #34a853; }
  </style>
</head>
<body>
  <h2>Check-in EJC</h2>

  <button id="iniciarBtn">📷 Iniciar Leitura</button>
  <div id="reader" style="width:100%; margin-top:20px;"></div>

  <div id="manual">
    <p>Sem conseguir ler o QR Code? Digite o código:</p>
    <input id="codigoInput" type="text" placeholder="EJC-0001" autocomplete="off" autocapitalize="characters">
    <br>
    <button id="validarBtn">✔ Validar código</button>
  </div>

  <div id="resultado"></div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbx78rgHUib1pQFznNsi4W5TCdDgbyP3ZML5YgGJXddKd-Ru4zg0yXBoOTt6IccJ4D4fsA/exec";

    const resultadoDiv = document.getElementById("resultado");
    const iniciarBtn = document.getElementById("iniciarBtn");
    const codigoInput = document.getElementById("codigoInput");
    const validarBtn = document.getElementById("validarBtn");
    let processando = false;
    let scanner;

    // Aceita "ejc-0005", " EJC-0005 " ou só "5"
    function normalizarCodigo(texto) {
      let c = String(texto).trim().toUpperCase();
      if (/^\d+$/.test(c)) {
        c = "EJC-" + c.padStart(4, "0");
      }
      return c;
    }

    iniciarBtn.addEventListener("click", () => {
      iniciarBtn.style.display = "none";
      scanner = new Html5Qrcode("reader");
      scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        (codigo) => validar(codigo)
      ).catch(err => {
        resultadoDiv.style.display = "block";
        resultadoDiv.className = "erro";
        resultadoDiv.innerHTML = "❌ Não foi possível acessar a câmera. Use a digitação do código abaixo.";
      });
    });

    validarBtn.addEventListener("click", () => {
      const texto = codigoInput.value;
      if (!texto.trim()) return;
      validar(texto);
    });

    codigoInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") validarBtn.click();
    });

    function validar(texto) {
      if (processando) return;
      processando = true;
      const codigo = normalizarCodigo(texto);

      fetch(API_URL + "?codigo=" + encodeURIComponent(codigo))
        .then(res => res.json())
        .then(mostrarResultado)
        .catch(() => {
          resultadoDiv.style.display = "block";
          resultadoDiv.className = "erro";
          resultadoDiv.innerHTML = "❌ Erro de conexão. Tente novamente.";
          setTimeout(() => { resultadoDiv.style.display = "none"; processando = false; }, 3000);
        });
    }

    function mostrarResultado(res) {
      resultadoDiv.style.display = "block";
      if (res.status === "ok") {
        resultadoDiv.className = "ok";
        resultadoDiv.innerHTML = "✅ LIBERADO<br>" + res.nome + " - " + res.qtd + " hambúrguer(es)";
      } else if (res.status === "ja_retirado") {
        resultadoDiv.className = "aviso";
        resultadoDiv.innerHTML = "⚠️ JÁ RETIRADO<br>" + res.nome;
      } else if (res.status === "nao_pago") {
        resultadoDiv.className = "aviso";
        resultadoDiv.innerHTML = "⚠️ PAGAMENTO NÃO CONFIRMADO<br>" + res.nome;
      } else {
        resultadoDiv.className = "erro";
        resultadoDiv.innerHTML = "❌ CÓDIGO NÃO ENCONTRADO";
      }
      codigoInput.value = "";
      setTimeout(() => { resultadoDiv.style.display = "none"; processando = false; }, 3000);
    }
  </script>
</body>
</html>
